<!DOCTYPE html>
<html>
  <head>
    <title>Login page</title>
    <style>
      .button-row {
        display: flex;
        justify-content: space-between;
      }

      button {
        flex: 1;
        margin: 0 5px;
      }
    </style>
  </head>
  <body>
    <h1>DJI Cloud API test</h1>

    <div class="button-row">
      <button id="login-button">Login</button>
      <button id="logout-button">Logout</button>
      <button id="raport-button">Raport</button>
    </div>
    <ul id="logs"></ul>
    <script>
      const APP_ID = 151135;
      const LICENSE =
        "%dji_license%";
      const APP_KEY = "36addda43d756a8ec33fa67d9419bba";
      const fieldList = document.getElementById("logs");
      const log = function (msg) {
          const li = document.createElement("li");
          li.innerText = msg;
          fieldList.appendChild(li);
      };
      const reg_calback = function () {
        log("Callback called🎉, arguments:" + Array.from(arguments));
      };
      const ws_callback = function(arg) {
          log("WS callback with data: " + arg)
      }
      const loginButton = document.getElementById("login-button");
      const djiBridge = window.djiBridge;
      loginButton.addEventListener("click", function () {
        log("login");
          const token = djiBridge.platformVerifyLicense(
              APP_ID,
              APP_KEY,
              LICENSE
          );

          const register_thing_params = JSON.stringify({
              host: "tcp://%mqtt_hostname%:1883", // mqtt address, example: tcp://xx.xx.xx.xx:xxx
              connectCallback: "reg_calback", // js interface for connection status callbacks
              username: "%mqtt_user_login%",
              password: "%mqtt_user_password%",
          });
          log(
          "Load Component: thing " +
            djiBridge.platformLoadComponent("thing", register_thing_params) +
            "\n Stateℹ️: " +
            djiBridge.thingGetConnectState()
        );
          const register_ws_params = JSON.stringify({
              host: "ws://192.168.1.74:5000/ws",
              token: "token_value",
              connectCallback: "ws_callback",
          });
          log(
            "Load Component: ws " +
            djiBridge.platformLoadComponent("ws", register_ws_params) +
            "\n Stateℹ️: " +
            djiBridge.wsGetConnectState()

        );
        log(
          "Start the connection thingconn: " +
            djiBridge.thingConnect("%mqtt_userlogin%", "%mqtt_userpassword%", "reg_calback")
        );

        log("Thing Connect state: " + djiBridge.thingGetConnectState());

        log(
          "Start the connection WS: " +
            djiBridge.wsConnect("ws://192.168.1.74:5000/ws", "token_value", "ws_callback")
        );

        log("WS Connect state: " + djiBridge.wsGetConnectState());

        log("platform is verified: " + djiBridge.platformIsVerified());

        log("Set workspace ID: " + djiBridge.platformSetWorkspaceId("e3dea0f5-37f2-4d79-ae58-490af3228069"))

        const keep_running = function () {
          return true
        };

        djiBridge.onBackClick(keep_running)

        log("Set workspace stuff:" + djiBridge.platformSetInformation("platformName", "workspaceName", "desc"))


        });

      const logoutButton = document.getElementById("logout-button");
      logoutButton.addEventListener("click", function () {
        log(
          "unregistering: " + djiBridge.platformUnloadComponent("thing")
        );
      });

      document
        .getElementById("raport-button")
        .addEventListener("click", function () {
          log(
            "Statusy platformIsComponentLoaded: " +
              djiBridge.platformIsComponentLoaded("thing") +
              "\nthing state" +
              djiBridge.thingGetConnectState()
          );
          log("Aircraft SN: " + djiBridge.platformGetAircraftSN())
          log("Things config:" + djiBridge.thingGetConfigs())
        });

    </script>
  </body>
</html>
